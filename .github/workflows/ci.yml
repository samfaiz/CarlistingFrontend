# CI for the standalone carsens-frontend repository (split from the monorepo).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Catalogue keys are invisible to tsc/eslint: a key the catalogue does not
      # have renders as raw text to users. Guard it in CI.
      - run: npm run check:locales
      - run: npm run build
